 <section class="mt-2 row">
    <div class="col-6">
    <img
        class="img-thumbnail"
        alt="Podgląd fotografii"
        [src]="imgUrl()"
    />
    </div>
    <div class="col-6">
    <form [formRoot]="auctionForm" novalidate>
        <div class="form-group">
        <label for="auctionTitle">Nazwa aukcji</label>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
            <span class="input-group-text"> 📝 </span>
            </div>
            <input id="auctionTitle" type="text" class="form-control" [formField]="auctionForm.title"/>
        </div>
        </div>
        <div class="form-group">
        <label for="auctionPrice">Cena aukcji</label>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
            <span class="input-group-text"> 💲 </span>
            </div>
            <input id="auctionPrice" type="number" class="form-control" [formField]="auctionForm.price"/>
        </div>
        </div>

        <div class="form-group">
        <label for="img">Zdjecie</label>
        <div class="input-group mb-3">
            <div class="input-group-prepend">
            <span class="input-group-text"> 📸 </span>
            </div>
            <input id="img" type="number" class="form-control" [formField]="auctionForm.imgId"/>
        </div>
        </div>

        <div class="form-group">
        <label for="auctionDescription">Szczegółowy opis</label>
        <div class="input-group mb-3">
            <textarea
            id="auctionDescription"
            rows="5"
            class="form-control"
            name="description"
            ></textarea>
        </div>
        </div>
        <div class="d-flex justify-content-end">
        <!-- <button class="btn btn-primary" (click)="onSubmit()">Dodaj aukcję</button> -->
         <button class="btn btn-primary" type="submit" [style.opacity]="auctionForm().valid() ? 1 : 0.5">Dodaj aukcję</button>
        </div>
    </form>
    </div>
</section>
